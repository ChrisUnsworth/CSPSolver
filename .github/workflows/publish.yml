name: Publish

on:
  push:
    branches: [ publish ]

permissions:
  contents: read
  id-token: write  # enable GitHub OIDC token issuance for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Prod

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore CSPSolver
    - name: Build
      run: dotnet build CSPSolver --no-restore --configuration Release
    - name: Test
      run: dotnet test CSPSolver --no-build --configuration Release --verbosity normal
    - name: Pack
      run: dotnet pack CSPSolver/CSPSolver.csproj --no-build --configuration Release --output ./nupkg
    - name: NuGet login (OIDC -> temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to NuGet
      run: dotnet nuget push "./nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
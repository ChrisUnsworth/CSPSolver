name: Publish

on:
  push:
    branches: [ publish ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore CSPSolver
    - name: Build
      run: dotnet build CSPSolver --no-restore --configuration Release
    - name: Test
      run: dotnet test CSPSolver --no-build --configuration Release --verbosity normal
    - name: Pack
      run: dotnet pack CSPSolver/CSPSolver.csproj --no-build --configuration Release --output ./nupkg
    - name: Publish to NuGet
      run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
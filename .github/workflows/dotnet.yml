name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore CSPSolver
    - name: Format check
      # MSTEST0032 is a pre-existing, deliberate marker in a known-failing test
      # (see #18) -- not a formatting issue, and it has no code fix, so
      # dotnet format can't resolve it either way.
      run: dotnet format CSPSolver/CSPSolver.sln --no-restore --verify-no-changes --exclude-diagnostics MSTEST0032
    - name: Build
      run: dotnet build CSPSolver --no-restore
    - name: Test
      run: dotnet test CSPSolver --no-build --verbosity normal
